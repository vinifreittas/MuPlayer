[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "MuPlayer"
dynamic = ["version"]
description = "A lightweight music app for terminal"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Vinicius Freittas", email = "vinifreitas6465@gmail.com" }]
keywords = ["Music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual>=8.2.8",
    "yt-dlp>=2026.8.19",
    "python-mpv>=1.0.8",
    "python-vlc>=3.0.21203",
    "tortoise-orm>=1.1.8",
    "aerich>=0.10.1",
    "diskcache>=5.6.3",
    "typer>=0.27.2",
    "pydantic>=2.13.5",
    "platformdirs>=4.12.2",
    "packaging>=26.3",
    "installed-browsers>=0.1.5",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
muplayer = "muplayer.main:cli"


[project.urls]
Homepage = "https://github.com/vinifreittas/MuPlayer"
Bug-Tracker = "https://github.com/vinifreittas/MuPlayer/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "deadcode>=2.4.1",
]

# --- Hatch Configuration ---

[tool.hatch.build.targets.wheel]
packages = ["src/muplayer"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# --- Third-Party Tools ---

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (syntax modernization)
    "B",   # flake8-bugbear (bug prevention)
    "SIM", # flake8-simplify (code simplification)
    "N",   # naming convention
    "RUF", # ruff specific rules
]

ignore = [
    "E501", # Line too long (Ruff's formatter handles this well anyway)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest Configuration ---

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.aerich]
tortoise_orm = "muplayer.infrastructure.database.config.TORTOISE_ORM"
location = "./src/muplayer/infrastructure/database/migrations"
src_folder = "./src"
