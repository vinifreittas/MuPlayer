[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "MuPlayer"
dynamic = ["version"]
description = "A lightweight music app for terminal"
requires-python = ">=3.12"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Vinicius Freittas", email = "vinifreitas6465@gmail.com" }
]
keywords = ["Music"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License", 
    "Operating System :: OS Independent"
]
dependencies = [
    "textual",
    "yt-dlp",
    "python-mpv",
    "python-vlc",
    "tortoise-orm",
    "quickjs",
    "diskcache",
    "typer",
    "pydantic",
    "platformdirs",
    "packaging",
]

[project.scripts]
muplayer = "muplayer.__main__:main"

[project.urls]
Homepage = "https://github.com/vinifreittas/MuPlayer"
Bug-Tracker = "https://github.com/vinifreittas/MuPlayer/issues"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "deadcode",
]

# --- Hatch Configuration ---

[tool.hatch.build.targets.wheel]
packages = ["src/muplayer"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"

# --- Third-Party Tools ---

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting)
    "UP",   # pyupgrade (syntax modernization)
    "B",    # flake8-bugbear (bug prevention)
    "SIM",  # flake8-simplify (code simplification)
    "N",    # naming convention
    "RUF",  # ruff specific rules
]

ignore = [
    "E501", # Line too long (Ruff's formatter handles this well anyway)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest Configuration ---

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
